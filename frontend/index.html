<!DOCTYPE html>
<html>
<head>
<title>SwasthaSevaAI</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<body>

<div class="header">

SwasthaSevaAI – Emergency Hospital Monitoring System

</div>


<header>

<h1>SwasthaSevaAI</h1>

<button onclick="openAdminLogin()">Hospital Admin Login</button>

</header>


<div class="controls">

<h2>Emergency Hospital Monitoring Dashboard</h2>


<select id="state" onchange="updateDistricts()">

<option value="">Select State</option>

<option value="Bihar">Bihar</option>
<option value="Uttar Pradesh">Uttar Pradesh</option>
<option value="Jharkhand">Jharkhand</option>

</select>



<select id="district" onchange="updateHospitals()">

<option value="">Select District</option>

</select>



<select id="hospital">

<option value="">Select Hospital</option>

</select>



<label>
<input type="checkbox" id="monsoon"> Monsoon
</label>

<label>
<input type="checkbox" id="outbreak"> Viral Outbreak
</label>


<button onclick="predict()">Run AI Prediction</button>

</div>




<div class="main-container">


<div class="dashboard">

<div class="card">
<h3>Predicted Patients</h3>
<p id="predictedPatients">--</p>
</div>

<div class="card">
<h3>Risk Level</h3>
<p id="riskLevel">--</p>
</div>

<div class="card">
<h3>Doctors Needed</h3>
<p id="doctorsNeeded">--</p>
</div>

<div class="card">
<h3>Bed Requirement</h3>
<p id="bedsNeeded">--</p>
</div>

<div class="card">
<h3>Available Beds</h3>
<p id="availableBeds">--</p>

</div>


</div>


<canvas id="forecastChart"></canvas>


<div id="suggestionBox">

<p id="suggestionText"></p>

</div>


</div>



<div id="adminLoginModal" class="modal">

<div class="modal-content">

<h3>Hospital Admin Login</h3>

<select id="adminHospital"></select>

<input type="password" id="adminPassword" placeholder="Enter password">

<br>

<button onclick="loginAdmin()">Login</button>

<button onclick="closeAdminLogin()">Close</button>

</div>

</div>



<script src="script.js"></script>

</body>
</html>
