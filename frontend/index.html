<!DOCTYPE html>
<html>
<head>

<title>SwasthaSevaAI</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="topbar">

<h2>SwasthaSevaAI</h2>

<button onclick="openAdminLogin()">Hospital Admin Login</button>

</div>



<div class="container">

<h1>Emergency Hospital Monitoring Dashboard</h1>

<p class="subtitle">
AI Based Patient Load Prediction & Hospital Resource Planning
</p>



<div class="controls">

<select id="state" onchange="updateDistricts()">
<option value="">Select State</option>
<option value="Bihar">Bihar</option>
<option value="Uttar Pradesh">Uttar Pradesh</option>
<option value="Jharkhand">Jharkhand</option>
</select>



<select id="district" onchange="updateHospitals()">
<option value="">Select District</option>
</select>



<select id="hospital">
<option value="">Select Hospital</option>
</select>



<label>
<input type="checkbox" id="monsoon">
Monsoon
</label>



<label>
<input type="checkbox" id="outbreak">
Viral Outbreak
</label>



<button onclick="predict()">Run AI Prediction</button>

</div>



<div class="card-container">

<div class="card">
<h3>Predicted Patients</h3>
<p id="load">--</p>
</div>

<div class="card">
<h3>Risk Level</h3>
<p id="risk">--</p>
</div>

<div class="card">
<h3>Doctors Needed</h3>
<p id="doctors">--</p>
</div>

<div class="card">
<h3>Bed Requirement</h3>
<p id="beds">--</p>
</div>

<div class="card">
<h3>Available Beds</h3>
<p id="availableBeds">--</p>
</div>

</div>


<canvas id="forecastChart"></canvas>


<div id="suggestionBox" class="suggestion" style="display:none">

<h3>Hospital Suggestion</h3>

<p id="suggestionText"></p>

</div>


</div>



<!-- ADMIN LOGIN -->

<div id="adminLogin" class="modal">

<div class="modal-content">

<h3>Hospital Admin Login</h3>

<input id="adminUser" placeholder="Username">

<input id="adminPass" type="password" placeholder="Password">

<button onclick="adminLogin()">Login</button>

<button onclick="closeAdminLogin()">Close</button>

</div>

</div>



<!-- ADMIN PANEL -->

<div id="adminPanel" class="adminPanel" style="display:none">

<h2>Hospital Admin Panel</h2>

<p id="adminHospitalTitle"></p>


<label>Current Patients</label>
<input id="adminPatients" type="number">

<label>Total Beds</label>
<input id="adminTotalBeds" type="number">

<label>Occupied Beds</label>
<input id="adminOccupiedBeds" type="number">

<label>Doctors On Duty</label>
<input id="adminDoctors" type="number">

<button onclick="submitAdminData()">Submit Hospital Data</button>

<p id="adminMessage"></p>

</div>


<script src="script.js"></script>

</body>
</html>
